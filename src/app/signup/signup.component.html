<div align="center">
    <h1>User Registration</h1>
    <form (submit)="signup()">
        <table>
            <tr>
                <th>First Name</th>
                <td><input type="text" name="firstName" [(ngModel)]="form.data.firstName" placeholder="enter your first name"></td>
            </tr>
            <tr>
                <th>Last Name</th>
                <td><input type="text" name="lastName" [(ngModel)]="form.data.lastName" placeholder="enter your last name"></td>
            </tr>
            <tr>
                <th>Login</th>
                <td><input type="email" name="login" [(ngModel)]="form.data.login" placeholder="enter your login"></td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="password" [(ngModel)]="form.data.password" placeholder="enter your password"></td>
            </tr>
            <tr>
                <th>DOB</th>
                <td><input type="date" name="dob" [(ngModel)]="form.data.dob" style="width: 165px;"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input  type="submit" value="save"></td>
            </tr>
        </table>
    </form>
</div>
